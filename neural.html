<title>Mizukiの脳 — NEURAL CONSTRUCT</title>
<style>
  :root {
    --ground: #05080e;
    --ground-2: #0c1421;
    --panel: rgba(8,14,24,0.62);
    --line: rgba(150,182,214,0.18);
    --line-s: rgba(150,182,214,0.34);
    --fg: #d4dfec;
    --fg-dim: #7d8fa6;
    --fg-faint: #4b5b6e;
    --r0: #4ed8e6;
    --r1: #5fe3a6;
    --r2: #b491ff;
    --r3: #5c8dff;
    --r4: #ffb25c;
    --r5: #ff7e74;
    --spark: #fff3d0;
    --font-d:"Bahnschrift","DIN Alternate","Oswald","Helvetica Neue",system-ui,sans-serif;
    --font-u:"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
    --font-m:"Cascadia Mono","Consolas",ui-monospace,"SF Mono",monospace;
  }
  body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--font-u);-webkit-font-smoothing:antialiased;overflow:hidden}

  .stage{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 46%,var(--ground-2) 0%,var(--ground) 68%)}

  #brain{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #brain.dragging{cursor:grabbing}

  /* corner ticks */
  .ticks{position:absolute;inset:0;pointer-events:none}
  .ticks i{position:absolute;width:18px;height:18px;border:0 solid var(--line);opacity:.8}
  .ticks i:nth-child(1){top:14px;left:14px;border-top-width:1px;border-left-width:1px}
  .ticks i:nth-child(2){top:14px;right:14px;border-top-width:1px;border-right-width:1px}
  .ticks i:nth-child(3){bottom:14px;left:14px;border-bottom-width:1px;border-left-width:1px}
  .ticks i:nth-child(4){bottom:14px;right:14px;border-bottom-width:1px;border-right-width:1px}

  /* HUD overlay — 3 columns: left panel | brain center (empty) | right panel */
  .hud{position:absolute;inset:0;padding:clamp(14px,2.2vw,30px);display:grid;
    grid-template-columns:200px 1fr 220px;grid-template-rows:auto 1fr auto;
    gap:clamp(10px,1.4vw,18px);pointer-events:none}
  .hud>*{pointer-events:auto}

  /* masthead */
  .masthead{grid-column:1;grid-row:1;max-width:28ch}
  .eyebrow{margin:0 0 8px;font-size:10.5px;letter-spacing:.24em;color:var(--fg-dim)}
  .eyebrow::before{content:"";display:inline-block;width:20px;height:1px;background:var(--line-s);vertical-align:middle;margin-right:9px}
  h1{margin:0;display:flex;align-items:baseline;gap:12px;font-weight:400;line-height:.9}
  h1 .ja{font-family:var(--font-u);font-size:clamp(32px,5.5vw,58px);font-weight:300;letter-spacing:.06em}
  h1 .la{font-family:var(--font-d);font-size:clamp(12px,1.4vw,17px);letter-spacing:.32em;color:var(--fg-dim);text-transform:uppercase}
  .lede{margin:12px 0 0;max-width:29ch;font-size:12.5px;line-height:1.65;color:var(--fg-dim)}

  /* right panel */
  .rpanel{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;gap:10px}

  /* readout */
  .readout{padding:13px 14px 11px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .readout h2{margin:0 0 9px;font-family:var(--font-d);font-size:9.5px;font-weight:400;
    letter-spacing:.22em;color:var(--fg-dim);text-transform:uppercase;display:flex;justify-content:space-between}
  #eeg{display:block;width:100%;height:44px}
  .stats{margin:10px 0 0;display:grid;gap:4px;font-family:var(--font-m);font-size:10.5px;font-variant-numeric:tabular-nums}
  .stats div{display:flex;justify-content:space-between;gap:8px}
  .stats dt{font-family:var(--font-d);letter-spacing:.16em;color:var(--fg-faint);font-style:normal}
  .stats dd{margin:0;color:var(--fg)}

  /* chat */
  .chat-box{flex:1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);overflow:hidden;min-height:0}
  .chat-head{padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--font-d);
    font-size:9.5px;letter-spacing:.22em;color:var(--fg-dim);text-transform:uppercase;display:flex;justify-content:space-between}
  .chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:8px;min-height:0}
  .chat-log::-webkit-scrollbar{width:2px}.chat-log::-webkit-scrollbar-thumb{background:var(--line-s)}
  .msg-w{display:flex;flex-direction:column;gap:1px}
  .msg-meta{font-size:6.5px;letter-spacing:.12em;color:var(--fg-faint);padding:0 2px;margin-top:3px}
  .msg{padding:5px 8px;font-size:10.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
  .msg.user{color:#7db8e8;border-left:1px solid rgba(93,170,220,.5);background:rgba(93,170,220,.06)}
  .msg.bot{color:#c8e8d0;border-left:1px solid rgba(95,227,166,.4);background:rgba(95,227,166,.05)}
  .msg.sys{color:var(--fg-faint);text-align:center;font-size:8px;letter-spacing:.18em;padding:5px}
  .chat-inp{border-top:1px solid var(--line);padding:7px 8px;display:flex;gap:5px}
  .chat-inp input{flex:1;background:rgba(8,14,24,.8);color:var(--fg);border:1px solid var(--line);
    border-radius:0;padding:5px 8px;font-family:var(--font-u);font-size:10.5px;outline:none}
  .chat-inp input:focus{border-color:var(--line-s)}
  .chat-inp input::placeholder{color:var(--fg-faint)}
  .chat-inp button{background:none;color:var(--fg-dim);border:1px solid var(--line);padding:5px 10px;
    font-family:var(--font-d);font-size:10px;letter-spacing:.12em;cursor:pointer;white-space:nowrap}
  .chat-inp button:hover{color:var(--fg);border-color:var(--line-s)}
  .chat-inp button:disabled{opacity:.3}
  .aist{font-size:8px;color:var(--fg-faint);letter-spacing:.15em;text-align:center;min-height:11px;padding:1px 8px}

  /* ── VOICE MODE ── */
  /* ── VOICE ORB DOCK ── */
  .voice-btn{background:none;border:0;color:var(--fg-faint);font-size:14px;cursor:pointer;padding:0 3px;line-height:1;transition:color .2s;vertical-align:middle}
  .voice-btn:hover{color:var(--r0)}
  .orb-dock{grid-column:1;grid-row:2;align-self:center;justify-self:center;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  #orbCanvas{display:block;cursor:pointer;flex:none}
  .orb-status{font-family:var(--font-d);font-size:8.5px;letter-spacing:.30em;color:var(--fg-faint);
    text-transform:uppercase;text-align:center;transition:color .3s}
  .orb-status.active{color:var(--r0)}
  .orb-transcript{max-width:190px;text-align:center;font-size:11.5px;color:var(--fg);
    line-height:1.6;white-space:pre-wrap;padding:7px 12px;display:none;
    background:rgba(5,8,14,.80);border:1px solid var(--line);backdrop-filter:blur(8px)}
  .orb-transcript.show{display:block}

  /* legend */
  .legend{grid-column:1;grid-row:3;align-self:end;display:grid;gap:1px;max-width:200px}
  .legend>p{margin:0 0 7px;font-family:var(--font-d);font-size:9.5px;letter-spacing:.22em;color:var(--fg-dim);text-transform:uppercase}
  .reg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;
    padding:5px 8px 5px 4px;background:none;border:0;border-left:1px solid transparent;
    color:var(--fg-dim);font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:.18s}
  .reg:hover{color:var(--fg);background:var(--panel)}
  .reg[aria-pressed=true]{color:var(--fg);background:var(--panel);border-left-color:currentColor}
  .swatch{width:10px;height:10px;border-radius:50%;background:var(--c);
    box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
  .reg .sub{font-family:var(--font-d);font-size:9px;letter-spacing:.14em;color:var(--fg-faint)}

  /* controls */
  .controls{grid-column:2;grid-row:4;display:none}/* hidden, moved inside rpanel */

  .ctrl-bar{padding:10px 12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .ctrl-row:last-child{margin:0}
  .cap{font-family:var(--font-d);font-size:9px;letter-spacing:.2em;color:var(--fg-faint);text-transform:uppercase;width:70px;flex:none}
  .switch{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;
    color:var(--fg-dim);font:inherit;font-size:11px;cursor:pointer}
  .switch i{width:24px;height:11px;border:1px solid var(--line-s);position:relative;flex:none}
  .switch i::after{content:"";position:absolute;top:1px;left:1px;width:9px;height:7px;background:var(--fg-faint);transition:.2s}
  .switch[aria-pressed=true]{color:var(--fg)}.switch[aria-pressed=true] i::after{transform:translateX(11px);background:var(--r0)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:11px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line-s)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:12px;margin-top:-6px;background:var(--fg);border:0}
  .vbtn{padding:3px 8px;background:none;border:1px solid var(--line);color:var(--fg-dim);font:inherit;font-size:11px;cursor:pointer}
  .vbtn:hover{color:var(--fg);border-color:var(--line-s)}
  .hint{grid-column:2;grid-row:2;align-self:end;justify-self:center;font-family:var(--font-d);
    font-size:9.5px;letter-spacing:.2em;color:var(--fg-faint);text-transform:uppercase;pointer-events:none;transition:opacity .5s;text-align:center}
  .hint span{display:block;margin-top:4px;font-family:var(--font-u);font-size:10.5px;letter-spacing:.05em;text-transform:none}
  .hint.gone{opacity:0}
</style>

<div class="stage" id="stage">
  <canvas id="brain" tabindex="0"></canvas>
  <div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="hud">
    <header class="masthead">
      <p class="eyebrow">神経解剖アトラス — 第二の脳</p>
      <h1><span class="ja">Mizuki</span><span class="la">Neural Construct</span></h1>
      <p class="lede">点群で構築した神経ネットワーク。走る光は活動電位、色は思考領域を示す。</p>
    </header>

    <!-- VOICE ORB — left column center row, separate from brain -->
    <div class="orb-dock" id="orbDock">
      <canvas id="orbCanvas" width="200" height="200"></canvas>
      <div class="orb-status" id="voiceStatus">タップして話す</div>
      <div class="orb-transcript" id="voiceTranscript"></div>
    </div>

    <div class="rpanel">
      <div class="readout">
        <h2>Cortical Activity <span style="font-family:var(--font-u);letter-spacing:.08em">皮質活動</span></h2>
        <canvas id="eeg"></canvas>
        <dl class="stats">
          <div><dt>Nodes</dt><dd id="s-nodes">—</dd></div>
          <div><dt>Synapses</dt><dd id="s-edges">—</dd></div>
          <div><dt>Spikes</dt><dd id="s-spikes">0</dd></div>
          <div><dt>Top Zone</dt><dd style="color:var(--r0)">技術/python</dd></div>
        </dl>
      </div>

      <div class="ctrl-bar">
        <div class="ctrl-row">
          <span class="cap">Rotation</span>
          <button class="switch" id="t-auto" aria-pressed="true"><i></i><span>自動</span></button>
        </div>
        <div class="ctrl-row">
          <span class="cap">Synapses</span>
          <button class="switch" id="t-edges" aria-pressed="true"><i></i><span>表示</span></button>
        </div>
        <div class="ctrl-row">
          <span class="cap">Activity</span>
          <input type="range" id="r-act" min="0" max="100" value="62">
        </div>
        <div class="ctrl-row" style="gap:4px">
          <button class="vbtn" data-view="lateral">側面</button>
          <button class="vbtn" data-view="anterior">前面</button>
          <button class="vbtn" data-view="superior">上面</button>
        </div>
      </div>

      <div class="chat-box">
        <div class="chat-head"><span>Neural Chat</span><span style="display:flex;align-items:center;gap:7px"><button class="voice-btn" id="voiceBtn" title="音声モード ▶ タップ">🎙</button><span id="ai-b" style="color:var(--r1)">STANDBY</span></span></div>
        <div class="chat-log" id="clog"><div class="msg sys">[ NEURAL LINK READY ]</div></div>
        <div class="aist" id="aist"></div>
        <div class="chat-inp">
          <input id="cin" placeholder="話しかける…" autocomplete="off"/>
          <button id="sbtn">SEND</button>
        </div>
      </div>
    </div>

    <nav class="legend" aria-label="思考領域">
      <p>Zones 思考領域</p>
      <button class="reg" data-region="0" aria-pressed="false" style="--c:var(--r0)">
        <span class="swatch"></span><span>技術 / python, AI, Streamlit…</span><span class="sub">FRONTAL</span>
      </button>
      <button class="reg" data-region="1" aria-pressed="false" style="--c:var(--r1)">
        <span class="swatch"></span><span>学習 / 機械学習, 深層学習…</span><span class="sub">PARIETAL</span>
      </button>
      <button class="reg" data-region="2" aria-pressed="false" style="--c:var(--r2)">
        <span class="swatch"></span><span>アイデア / 記憶, 開発…</span><span class="sub">TEMPORAL</span>
      </button>
      <button class="reg" data-region="3" aria-pressed="false" style="--c:var(--r3)">
        <span class="swatch"></span><span>目標 / データ, 専用…</span><span class="sub">OCCIPITAL</span>
      </button>
      <button class="reg" data-region="4" aria-pressed="false" style="--c:var(--r4)">
        <span class="swatch"></span><span>感情 / 楽しい, 疲れ…</span><span class="sub">CEREBELLUM</span>
      </button>
      <button class="reg" data-region="5" aria-pressed="false" style="--c:var(--r5)">
        <span class="swatch"></span><span>人間関係 / 友達…</span><span class="sub">BRAINSTEM</span>
      </button>
    </nav>

    <p class="hint" id="hint">Drag to rotate · Scroll to zoom<span>ドラッグで回転・ホイールで拡大</span></p>
  </div>

</div>

<script>
(()=>{
"use strict";
const stage=document.getElementById('stage');
const cv=document.getElementById('brain');
const ctx=cv.getContext('2d',{alpha:false});
const eeg=document.getElementById('eeg');
const ectx=eeg.getContext('2d');
const motQ=matchMedia('(prefers-reduced-motion:reduce)');
let redMo=motQ.matches;

// ── REGIONS ──
const F=0,PA=1,T=2,O=3,CB=4,ST=5;
const RVARS=['--r0','--r1','--r2','--r3','--r4','--r5'];
const RLABELS=[['技術','FRONTAL LOBE'],['学習','PARIETAL LOBE'],['アイデア','TEMPORAL LOBE'],['目標','OCCIPITAL LOBE'],['感情','CEREBELLUM'],['人間関係','BRAINSTEM']];
const RCONCEPTS=[['python','AI','Streamlit','ClaudeAPI','オセロ'],['機械学習','深層学習','勉強','精度'],['アイデア','記憶','開発'],['目標','データ','専用','GitHub'],['楽しい','疲れ'],['友達']];

// ── GEOMETRY ──
const CBB={x:0,y:-.215,z:-.375,rx:.238,ry:.132,rz:.172};
function inCB(x,y,z,pad){
  const dx=(x-CBB.x)/(CBB.rx+pad),dy=(y-CBB.y)/(CBB.ry+pad),dz=(z-CBB.z)/(CBB.rz+pad);
  return dx*dx+dy*dy+dz*dz<1;}

const GOLDEN=Math.PI*(3-Math.sqrt(5));
function buildGeo(budget){
  const X=[],Y=[],Z=[],R=[];
  const n=budget.c,jit=3.4/Math.sqrt(n);
  for(let i=0;i<n;i++){
    const uy=1-(i/(n-1))*2,ur=Math.sqrt(Math.max(0,1-uy*uy)),th=i*GOLDEN;
    let nx=Math.cos(th)*ur+(Math.random()-.5)*jit;
    let ny=uy+(Math.random()-.5)*jit;
    let nz=Math.sin(th)*ur+(Math.random()-.5)*jit;
    const inv=1/Math.hypot(nx,ny,nz);nx*=inv;ny*=inv;nz*=inv;
    let x=nx*.47,y=ny*.385,z=nz*.63;
    if(z>0){const t=z/.63,f=1-.30*t*t;x*=f;y*=f;}
    else{const t=-z/.63,f=1-.15*t*t*t;x*=f;y*=f*(1-.06*t);}
    if(y<0)y*=.80;
    if(z>-.32){const t=Math.max(0,Math.min(1,(-y-.01)/.14));x*=1+.14*t*t*(3-2*t);}
    const ax=Math.abs(x),groove=Math.exp(-(ax*ax)/.0027);
    if(y>0)y*=1-.34*groove;
    x=(x<0?-1:1)*(ax*.96+.013);
    const yl=.026-.35*z;let inS=0;
    if(z>-.30&&z<.36&&Math.abs(x)>.075){
      const d=(y-yl)/.040;inS=Math.exp(-d*d);
      x-=nx*inS*.058;y-=ny*inS*.030;z-=nz*inS*.052;}
    let reg;
    if(z<-.28)reg=O;else if(y<yl&&z<.34)reg=T;else if(z>.21)reg=F;else reg=PA;
    const fold=.74*Math.sin(nx*11.5+nz*3.1)*Math.sin(ny*9.3-nx*4.4)*Math.sin(nz*10.2+ny*5.6)+
      .26*Math.sin(nx*20.5-ny*6.2)*Math.sin(nz*18.0+nx*7.5);
    x+=nx*fold*.032*(1-.7*inS);y+=ny*fold*.029*(1-.7*inS);z+=nz*fold*.038*(1-.7*inS);
    if(inCB(x,y,z,.02))continue;
    X.push(x);Y.push(y);Z.push(z);R.push(reg);}

  const m=budget.cb,jitc=2.6/Math.sqrt(m);
  for(let i=0;i<m;i++){
    const uy=1-(i/(m-1))*2,ur=Math.sqrt(Math.max(0,1-uy*uy)),th=i*GOLDEN;
    let nx=Math.cos(th)*ur+(Math.random()-.5)*jitc;
    let ny=uy+(Math.random()-.5)*jitc*.4;
    let nz=Math.sin(th)*ur+(Math.random()-.5)*jitc;
    const inv=1/Math.hypot(nx,ny,nz);nx*=inv;ny*=inv;nz*=inv;
    let x=CBB.x+nx*CBB.rx,y=CBB.y+ny*CBB.ry,z=CBB.z+nz*CBB.rz;
    const fol=Math.sin((y-CBB.y)*190)*.011;x+=nx*fol;y+=ny*fol*.4;z+=nz*fol;
    const dip=Math.exp(-(x*x)/.0016)*.016;z+=dip*(nz>0?-1:1);
    X.push(x);Y.push(y);Z.push(z);R.push(CB);}

  const rings=budget.sr,prr=9;
  for(let i=0;i<rings;i++){
    const t=i/(rings-1),cy=-.09-t*.44,cz=-.05+t*.055-Math.sin(t*2.1)*.03,rad=.086-t*.036;
    for(let j=0;j<prr;j++){
      const a=(j/prr)*Math.PI*2+i*.4;
      const x=Math.cos(a)*rad,z2=cz+Math.sin(a)*rad*.92,y2=cy+Math.sin(a*3+i)*.004;
      if(y2>-.16&&inCB(x,y2,z2,-.03))continue;
      X.push(x);Y.push(y2);Z.push(z2);R.push(ST);}}
  return{X,Y,Z,R};}

const isSmall=matchMedia('(max-width:900px)').matches;
const geo=buildGeo(isSmall?{c:2200,cb:480,sr:30}:{c:3800,cb:780,sr:44});
const COUNT=geo.X.length;
const px=Float32Array.from(geo.X),py=Float32Array.from(geo.Y),pz=Float32Array.from(geo.Z);
const preg=Uint8Array.from(geo.R);
const pphase=new Float32Array(COUNT);
const sx0=new Float32Array(COUNT),sy0=new Float32Array(COUNT),sz0=new Float32Array(COUNT);
for(let i=0;i<COUNT;i++){
  pphase[i]=-pz[i]*8.2+py[i]*2.4;
  const r=1.5+Math.random()*1.4,a=Math.random()*Math.PI*2;
  const c=Math.random()*2-1,s=Math.sqrt(1-c*c);
  sx0[i]=Math.cos(a)*s*r;sy0[i]=c*r*.7;sz0[i]=Math.sin(a)*s*r;}

// ── EDGES ──
const nodes=[];for(let i=0;i<COUNT;i+=5)nodes.push(i);
const ea=[],eb=[];const seen=new Set();
const addE=(a,b)=>{const k=a<b?a*100003+b:b*100003+a;if(seen.has(k))return;seen.add(k);ea.push(a);eb.push(b);};
const MD2=.105*.105;
for(let i=0;i<nodes.length;i++){
  const a=nodes[i],ax=px[a],ay=py[a],az=pz[a];
  let b1=-1,b2=-1,d1=Infinity,d2=Infinity;
  for(let j=0;j<nodes.length;j++){if(j===i)continue;const b=nodes[j];
    const dx=px[b]-ax,dy=py[b]-ay,dz=pz[b]-az,d=dx*dx+dy*dy+dz*dz;
    if(d>MD2)continue;if(d<d1){d2=d1;b2=b1;d1=d;b1=b;}else if(d<d2){d2=d;b2=b;}}
  if(b1>=0)addE(a,b1);if(b2>=0&&Math.random()<.72)addE(a,b2);}
for(let k=0;k<28;k++){
  const a=nodes[(Math.random()*nodes.length)|0];
  if(px[a]<0||Math.abs(pz[a])>.34)continue;
  let best=-1,bestD=Infinity;

function hopPulse(p){
  const ep=p.dir>0?eb[p.e]:ea[p.e];const list=edgeAt.get(ep);if(!list||list.length<2)return false;

function frame(now){

  const S=Math.min(W,H)*.72*view.zoom,ox=W/2,oy=H/2+Math.min(W,H)*.02;
  const asm=easeOut(view.assembly),morphing=view.assembly<1;
  const aBase=.20,aGain=.80,aWave=.34;

  for(let i=0;i<BINS;i++)bins[i].length=0;

    if(morphing){X=sx0[i]+(X-sx0[i])*asm;Y=sy0[i]+(Y-sy0[i])*asm;Z=sz0[i]+(Z-sz0[i])*asm;}
    const x1=X*cy-Z*sy,z1=X*sy+Z*cy;

    if(view.isolate>=0&&preg[i]!==view.isolate)a*=.09;

  const g=oc.createLinearGradient(0,0,0,len);
  g.addColorStop(0,   `rgba(${col},0)`);
  g.addColorStop(.15, `rgba(${col},${alpha*.5})`);
  g.addColorStop(.42, `rgba(${col},${alpha})`);
  g.addColorStop(.70, `rgba(${col},${alpha*.72})`);
  g.addColorStop(1,   `rgba(${col},0.03)`);
  oc.fillStyle=g;oc.fill();
}

function drawOrb(){
  orbT+=0.016;
  if(state==='listening')      targetAmp=getMicAmp();
  else if(state==='speaking')  targetAmp=.28+Math.sin(orbT*4.8)*.18+Math.sin(orbT*11)*.07;
  else if(state==='thinking')  targetAmp=.09+Math.sin(orbT*1.9)*.045;
  else                         targetAmp=.042+Math.sin(orbT*.9)*.022;
  amp+=(targetAmp-amp)*.12;

  const speedMul=state==='idle'?1:state==='thinking'?2.2:4;

  oc.clearRect(0,0,SZ,SZ);oc.globalAlpha=1;oc.globalCompositeOperation='source-over';

  // rainbow atmospheric glow (cycles through hues)
  const hueShift=orbT*20%360;
  const aR=94+amp*28;
  const aura=oc.createRadialGradient(CX,CY,6,CX,CY,aR);
  aura.addColorStop(0,`hsla(${hueShift},90%,65%,${.07+amp*.16})`);
  aura.addColorStop(.5,`hsla(${(hueShift+120)%360},85%,55%,${.03+amp*.06})`);
  aura.addColorStop(1,'rgba(5,8,14,0)');
  oc.fillStyle=aura;oc.beginPath();oc.arc(CX,CY,aR,0,Math.PI*2);oc.fill();

  // ── 5 rainbow petal layers — lighter blend ──
  oc.globalCompositeOperation='lighter';
  PETAL_LAYERS.forEach(({n,len,wid,spd,ph},li)=>{
    const baseRot=orbT*spd*speedMul+ph;
    const l=len*(1+amp*.34);
    const w=wid*(1+amp*.24);
    const alpha=.68+amp*.32;
    // each layer's color palette offset shifts with time for slow rainbow spin
    const colOffset=Math.floor(orbT*spd*.5*RAINBOW.length+li*1.3)%RAINBOW.length;
    for(let i=0;i<n;i++){
      const angle=baseRot+(i/n)*Math.PI*2;
      const lw=l*(1+.055*Math.sin(orbT*2.6+i*1.2+ph));
      const col=RAINBOW[(colOffset+i)%RAINBOW.length];
      oc.save();oc.translate(CX,CY);oc.rotate(angle);
      drawPetal(lw,w,col,alpha);
      oc.restore();}});

  // ── white glowing core ──
  oc.globalCompositeOperation='source-over';oc.globalAlpha=1;
  const cR=16+amp*9;
  // rainbow plasma halo
  const halo=oc.createRadialGradient(CX,CY,cR*.3,CX,CY,cR*3.4);
  halo.addColorStop(0,`hsla(${hueShift},85%,72%,${.44+amp*.34})`);
  halo.addColorStop(.35,`hsla(${(hueShift+90)%360},80%,60%,${.18+amp*.12})`);
  halo.addColorStop(1,'rgba(5,8,14,0)');
  oc.fillStyle=halo;oc.beginPath();oc.arc(CX,CY,cR*3.4,0,Math.PI*2);oc.fill();
  // white sphere
  const cg=oc.createRadialGradient(CX-6,CY-5,0,CX,CY,cR);
  cg.addColorStop(0,'rgba(255,255,255,1)');
  cg.addColorStop(.22,'rgba(220,248,255,.86)');
  cg.addColorStop(.58,'rgba(160,200,255,.30)');
  cg.addColorStop(1,'rgba(100,140,255,0)');
  oc.fillStyle=cg;oc.beginPath();oc.arc(CX,CY,cR,0,Math.PI*2);oc.fill();
  oc.shadowColor='rgba(255,255,255,.95)';oc.shadowBlur=16+amp*22;
  oc.beginPath();oc.arc(CX,CY,cR*.42,0,Math.PI*2);oc.fill();oc.shadowBlur=0;

  // listening ripples (rainbow)
  if(state==='listening'&&amp>.04){
    for(let r=0;r<3;r++){
      oc.beginPath();oc.arc(CX,CY,34+amp*58+r*19*(1-amp*.4),0,Math.PI*2);
      oc.strokeStyle=`hsla(${(hueShift+r*60)%360},90%,65%,${(.30-r*.08)*amp})`;
      oc.lineWidth=1.1+amp;oc.stroke();}}

  raf=requestAnimationFrame(drawOrb);}

// ── State ──
const STATUS={idle:'タップして話す',listening:'聴いています…',thinking:'考え中…',speaking:'話しています…'};
function setState(s){
  state=s;
  statusEl.textContent=STATUS[s]||s;
  statusEl.className='orb-status'+(s!=='idle'?' active':'');
  if(s==='idle'||s==='speaking'){transEl.classList.remove('show');}
  else if(s==='thinking'){transEl.classList.add('show');}
}

// ── SpeechRecognition ──
const SpeechR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SpeechR){
  rec=new SpeechR();rec.lang='ja-JP';rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=e=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      e.results[i].isFinal?final+=t:interim+=t;}
    transEl.textContent=final||interim;transEl.classList.add('show');
    if(final){rec.stop();handleVoiceInput(final);}};
  rec.onerror=()=>setState('idle');
  rec.onend=()=>{if(state==='listening')setState('idle');};}

// ── TTS ──
const synth=window.speechSynthesis;
function speak(text){
  if(!synth){setState('idle');return;}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=1.05;u.pitch=1.08;
  const jv=synth.getVoices().find(v=>v.lang.startsWith('ja'));if(jv)u.voice=jv;
  u.onstart=()=>{transEl.textContent=text;transEl.classList.add('show');};
  u.onend=()=>{setState('idle');transEl.classList.remove('show');};
  u.onerror=()=>setState('idle');
  synth.speak(u);}

// ── AI response ──
async function handleVoiceInput(text){
  setState('thinking');transEl.textContent=text;transEl.classList.add('show');
  const DEMOS={'おはよう':'おはよう！脳内では「python」と「AI」が最も活性化してるよ🧠\n今日は何を作る？','ai':'AIゾーン全開！python × AI × 機械学習がつながってるね。深層学習も増加中📈','python':'pythonが最も活性化してる！機械学習・Streamlit・オセロ全部つながってるよ🐍','記憶':'📋 覚えてる: AIオセロ・Streamlit脳内マップ・ClaudeAPI統合\nどれか詳しく話す？','アイデア':'💡 アイデアゾーン点灯！記憶自動タグ付け × 関連アイデア提案、どれから始める？'};
  const key=Object.keys(DEMOS).find(k=>text.includes(k));
  let reply=key?DEMOS[key]:`「${text}」受信！\nデモモード中。claude.aiで開くと本物のAIが答えるよ。\n試して: 「おはよう」「AI」「python」`;
  if(voiceSample){
    try{
      const t=[{role:'user',content:`あなたはMizukiの専属AIパートナー「ミズキBot」。Mizukiは日本人AI・Python開発者。AIオセロ・Streamlit脳内マップ・ClaudeAPI統合を制作。フレンドリーかつ技術的に2〜3文日本語で返答。絵文字適度に。`},{role:'user',content:text}];
      let r='';
      await voiceSample(t,{cache:false,modelTier:'quick',onText:({text:tx})=>{r=tx;}});
      reply=r||reply;
    }catch(e){reply=e.text||reply;}
  }else await new Promise(r=>setTimeout(r,900));
  setState('speaking');speak(reply);}

// ── Click orb to listen ──
orb.addEventListener('click',async()=>{
  if(state==='thinking'||state==='speaking')return;
  if(state==='listening'){if(rec)rec.stop();return;}
  if(!analyser)await initMic();
  if(!rec){transEl.textContent='Chrome / Edgeをお試しください。';transEl.classList.add('show');return;}
  setState('listening');transEl.textContent='';transEl.classList.remove('show');
  try{rec.start();}catch(_){setState('idle');}});

// Chat header mic button also starts listening
if(voiceBtn)voiceBtn.addEventListener('click',()=>orb.click());

// Start orb animation immediately
raf=requestAnimationFrame(drawOrb);

(async()=>{try{if(window.claude)voiceSample=await window.claude.use('sample');}catch(_){}})();
if(synth){synth.getVoices();synth.addEventListener('voiceschanged',()=>synth.getVoices());}
})();
</script>
